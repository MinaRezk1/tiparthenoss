<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0b26" />
      <stop offset="50%" stop-color="#4a1440" />
      <stop offset="100%" stop-color="#86306f" />
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Glowing Aura Gradient -->
    <radialGradient id="aura" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#270c24" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  
  <!-- Outer Gold Frame -->
  <rect x="18" y="18" width="476" height="476" rx="102" fill="none" stroke="url(#goldGrad)" stroke-width="6" filter="url(#glow)" />
  <rect x="28" y="28" width="456" height="456" rx="92" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.15" />

  <!-- Soft glow behind the lily -->
  <circle cx="256" cy="210" r="180" fill="url(#aura)" />

  <!-- TI PARTHENOS (تي بارثينوس = العذراء) — زنبقة العذراء داخل هالة ذهبية -->
  <defs>
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff1f5" />
      <stop offset="55%" stop-color="#ffc9da" />
      <stop offset="100%" stop-color="#f7739c" />
    </linearGradient>
    <path id="petal" d="M0,-100 C20,-74 22,-42 0,-14 C-22,-42 -20,-74 0,-100 Z" />
  </defs>
  <g transform="translate(256, 210)">
    <!-- Golden halo -->
    <circle cx="0" cy="-30" r="85" fill="none" stroke="url(#goldGrad)" stroke-width="10" filter="url(#glow)" />
    <circle cx="0" cy="-30" r="75" fill="none" stroke="#fef08a" stroke-width="2" opacity="0.8" />
    <path d="M-5,-105 L5,-105 M0,-110 L0,-100" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
    <path d="M-80,-35 L-70,-35 M-75,-40 L-75,-30" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
    <path d="M70,-35 L80,-35 M75,-40 L75,-30" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />

    <!-- Stem and leaves -->
    <path d="M0,-14 C4,30 -4,80 0,122" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
    <path d="M1,72 C-22,50 -52,54 -70,78 C-44,86 -18,84 1,72 Z" fill="url(#goldGrad)" opacity="0.9" />
    <path d="M0,40 C22,20 50,24 66,46 C42,54 18,52 0,40 Z" fill="url(#goldGrad)" opacity="0.9" />

    <!-- Lily petals -->
    <use href="#petal" transform="translate(0,-14) rotate(-78) scale(0.72) translate(0,14)" fill="url(#petalGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
    <use href="#petal" transform="translate(0,-14) rotate(78) scale(0.72) translate(0,14)" fill="url(#petalGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
    <use href="#petal" transform="translate(0,-14) rotate(-40) scale(0.92) translate(0,14)" fill="url(#petalGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
    <use href="#petal" transform="translate(0,-14) rotate(40) scale(0.92) translate(0,14)" fill="url(#petalGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
    <use href="#petal" fill="url(#petalGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />

    <!-- Stamens -->
    <path d="M0,-18 L-12,-52 M0,-18 L0,-58 M0,-18 L12,-52" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
    <circle cx="-12" cy="-54" r="4" fill="#fbbf24" />
    <circle cx="0" cy="-60" r="4" fill="#fbbf24" />
    <circle cx="12" cy="-54" r="4" fill="#fbbf24" />
  </g>

  <!-- TYPOGRAPHY / APP TITLE AT THE BOTTOM (الاسم في الأسفل) -->
  <!-- "Points" with elegant modern tech styling, and "ثانوي بنات" underneath in fine Cairo-like geometric style -->
  <g transform="translate(256, 435)">
    <!-- Main modern bold label: Points -->
    <text x="0" y="-12" font-family="'Cairo', 'Inter', sans-serif" font-weight="900" font-size="34" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4" filter="url(#glow)">POINTS</text>
    <text x="0" y="-12" font-family="'Cairo', 'Inter', sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="4">POINTS</text>
    
    <!-- Secondary Arabic label: تي بارثينوس - ثانوي بنات -->
    <rect x="-130" y="8" width="260" height="28" rx="14" fill="#1f0a1c" opacity="0.6" stroke="url(#goldGrad)" stroke-width="1.5" />
    <text x="0" y="27" font-family="'Cairo', sans-serif" font-weight="700" font-size="14" fill="#fef08a" text-anchor="middle">تي بارثينوس - ثانوي بنات</text>
  </g>

</svg>
