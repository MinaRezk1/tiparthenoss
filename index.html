<!DOCTYPE html>
<html lang="ar" dir="rtl">
    <head>
    <meta charset="UTF-8" />

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#270c24" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <link rel="icon" type="image/png" href="%BASE_URL%icon-192.png" sizes="192x192" />

    <title>Points ثانوي بنات - اجتماع الأنبا رويس</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // ألوان نسخة البنات: درجات indigo بقت بنفسجي وردي (plum)، ودرجات amber بقت وردي (rose)
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              indigo: {
                50: '#fbf3f9', 100: '#f6e5f1', 200: '#ecc9e4', 300: '#dda1cf', 400: '#c271ae',
                500: '#a2468a', 600: '#86306f', 700: '#6c2659', 800: '#56204a', 900: '#421a3c', 950: '#270c24'
              },
              amber: {
                50: '#fff1f5', 100: '#ffe0ea', 200: '#ffc9da', 300: '#ffb3ca', 400: '#ff9ebb',
                500: '#f7739c', 600: '#e0527f', 700: '#bd3b66', 800: '#952c50', 900: '#782543', 950: '#431022'
              }
            }
          }
        }
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Cairo', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #270c24; /* plum-950 */
        background-image:
          radial-gradient(circle at 1px 1px, rgba(255,190,215,0.06) 1px, transparent 0);
        background-size: 25px 25px;
      }
      .animate-fade-in-out {
        animation: fadeInOut 3s ease-in-out;
      }
      @keyframes fadeInOut {
        0% { opacity: 0; transform: translateY(10px); }
        20% { opacity: 1; transform: translateY(0); }
        80% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(10px); }
      }
       /* Hide spin buttons on number inputs */
      input[type='number']::-webkit-inner-spin-button,
      input[type='number']::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type='number'] {
        -moz-appearance: textfield;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register(new URL('sw.js?v=2026.09.22.girls1', document.baseURI))
            .then(reg => console.log('Service Worker registered!', reg))
            .catch(err => console.log('Service Worker registration failed: ', err));
        });
      }
    </script>
  </body>
</html>
